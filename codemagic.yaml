workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    # Tên integration App Store Connect API key đã tạo trong Codemagic
    # (Teams/App settings → Integrations → Developer Portal).
    # Phải khớp CHÍNH XÁC tên bạn đặt lúc thêm key, nếu không build fail ngay.
    integrations:
      app_store_connect: app_store_connect_key

    environment:
      # Ký iOS tự động: Codemagic dùng API key ở trên để tạo/lấy
      # certificate + provisioning profile cho bundle id này.
      ios_signing:
        distribution_type: app_store   # đổi sang ad_hoc nếu muốn cài trực tiếp lên máy test
        bundle_identifier: com.tung1506.esimwebviewhost
      vars:
        XCODE_WORKSPACE: "esim_webview_host/ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.tung1506.esimwebviewhost"

      flutter: 3.24.5
      xcode: 15.4
      cocoapods: default

    scripts:
      - name: Get Flutter packages for esim_webview_host
        script: |
          cd esim_webview_host
          flutter pub get

      - name: Set up code signing
        script: |
          cd esim_webview_host
          xcode-project use-profiles

      # Không chạy `pod install` thủ công: repo chưa có ios/Podfile,
      # file này do Flutter sinh ra trong lúc build. `flutter build ipa`
      # tự chạy pod install sau khi sinh Podfile.
      - name: Build IPA
        script: |
          cd esim_webview_host
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist


    artifacts:
      - esim_webview_host/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      
    publishing:
      email:
        recipients:
          - your.email@example.com
        notify:
          success: true
          failure: true
          
  # ✅ ADD: Android workflow for testing
  android-workflow:
    name: Android Build (Test)
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      # BẮT BUỘC ghim: không ghim thì Codemagic dùng Flutter stable mới nhất,
      # mà từ Flutter 3.29 trở đi packages/flutter_tools/gradle/build.gradle.kts
      # áp dụng plugin `kotlin-dsl` → đòi Gradle >= 7.6.3. Project này đang
      # xài Gradle 7.5 + AGP 7.3.0 nên build vỡ ngay khi cấu hình Gradle.
      # Flutter 3.24.5 dùng flutter_tools gradle thuần Groovy → chạy được với 7.5.
      flutter: 3.24.5
      # Gradle 7.5 chỉ chạy tới Java 18; image mặc định có thể là Java 21 →
      # ghim 17 cho chắc (AGP 7.3 cần Gradle >= 7.4, Java 17 cần Gradle >= 7.3).
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      
    scripts:
      - name: Get Flutter packages for flutter_esim
        script: |
          cd flutter_esim
          flutter pub get
          
      - name: Get Flutter packages for esim_webview_host
        script: |
          cd esim_webview_host
          flutter pub get
          
      - name: Build Android APK
        script: |
          cd esim_webview_host
          flutter build apk --debug
          
    artifacts:
      - esim_webview_host/build/app/outputs/flutter-apk/*.apk